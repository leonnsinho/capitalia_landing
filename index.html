<!DOCTYPE html>
<html lang="pt-BR" style="scroll-behavior: smooth;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/capitalia_logo.png" />
    <title>Capitalia - Finanças Inteligentes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Preconnect for YouTube (speeds up iframe/thumbnail load when user interacts) -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
    <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400;700&family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Exo 2', sans-serif;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Rowdies', sans-serif;
      }
      
      @media (min-width: 1024px) {
        body {
          zoom: 0.8;
        }
      }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
        100% { transform: translateY(0px); }
      }
      
      @keyframes float-delayed {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0px); }
      }

      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      
      .animate-float-delayed {
        animation: float-delayed 7s ease-in-out infinite;
        animation-delay: 2s;
      }

      /* Custom scrollbar for inner content */
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* ── Hero entrance animations ─────────────────────────── */
      @keyframes heroBlurUp {
        from { opacity: 0; transform: translateY(24px); filter: blur(8px); }
        to   { opacity: 1; transform: translateY(0);    filter: blur(0);   }
      }
      @keyframes heroFadeUp {
        from { opacity: 0; transform: translateY(28px); }
        to   { opacity: 1; transform: translateY(0);    }
      }
      @keyframes heroPop {
        from { opacity: 0; transform: translateY(16px) scale(0.93); }
        to   { opacity: 1; transform: translateY(0)    scale(1);    }
      }
      @keyframes heroFadeRight {
        from { opacity: 0; transform: translateX(56px) scale(0.96); }
        to   { opacity: 1; transform: translateX(0)    scale(1);    }
      }
      @keyframes heroFadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes heroBlobIn {
        from { opacity: 0; transform: scale(0.94) translateX(40px); }
        to   { opacity: 1; transform: scale(1)    translateX(0);    }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              heading: ['Rowdies', 'sans-serif'],

                700: '#047857',

          }
        }
      }
    </script>
